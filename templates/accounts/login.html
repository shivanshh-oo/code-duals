{% extends 'base.html' %}

{% block title %}Login - CodeDuels{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card fade-in">
            <div class="card-header text-center">
                <h2 class="w-100 mb-0">Welcome Back</h2>
            </div>
            <div class="card-body">
                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" autofocus required>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-yellow w-100 py-2"><span data-icon="login"></span> Log In</button>
                </form>
                <p class="text-center mt-4 mb-0 text-muted">Don't have an account? <a href="{% url 'register' %}" class="fw-bold">Register</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
