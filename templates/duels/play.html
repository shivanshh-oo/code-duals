{% extends 'base.html' %}

{% block title %}Play - CodeDuels{% endblock %}

{% block content %}
<section class="splash fade-in" style="text-align:left;padding:36px 32px 56px">
    <span class="chip chip--yellow" style="margin-bottom:12px"><span data-icon="swords" data-size="14"></span> ENTER THE ARENA</span>
    <h1>Ready. Set. Code.</h1>
    <p class="mt-2 mb-0">Your rating: <span class="badge badge--yellow"><span data-icon="trophy" data-size="13"></span> {{ user.profile.rating }} RP</span></p>
</section>

<div class="card fade-in my-4">
    <div class="card-header">
        <h2 style="margin:0">Choose your challenge</h2>
    </div>
    <div class="card-body">
        <form id="setup">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="matchType">Duel Format</label>
                <select id="matchType" class="form-select" name="match_type">
                    <option value="1v1" selected>1v1 Solo Duel</option>
                    <option value="2v2">2v2 Squad / Team Duel</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" for="diff">Difficulty</label>
                <select id="diff" class="form-select" name="difficulty">
                    <option>Easy</option>
                    <option selected>Medium</option>
                    <option>Hard</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" for="dur">Private match duration (minutes)</label>
                <input id="dur" class="form-control" name="duration" type="number" min="10" max="60" value="30">
            </div>
            <div class="d-flex gap-2 mt-4" style="flex-wrap:wrap">
                <button class="btn btn-yellow" type="button" onclick="join()"><span data-icon="search"></span> Find a rival</button>
                <button class="btn btn-outline" type="button" onclick="cancel()">Cancel search</button>
                <button class="btn btn-peri" type="button" onclick="createRoom()"><span data-icon="users"></span> Create Private Duel</button>
            </div>
        </form>
        <p id="notice" class="mt-3 text-muted" role="status" style="font-weight:600;"></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let waiting=false;
const form=document.getElementById('setup'), notice=document.getElementById('notice');
async function post(url){
    const r=await fetch(url,{method:'POST',body:new FormData(form)});
    const d=await r.json();
    if(!r.ok) throw Error(d.error||'Request failed');
    return d;
}
async function join(){
    try {
        await post('{% url "quick_match_join" %}');
        waiting=true;
        notice.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span> Finding your rival...';
    } catch(e){
        notice.textContent=e.message;
    }
}
async function cancel(){
    await post('{% url "quick_match_cancel" %}');
    waiting=false;
    notice.textContent='Search cancelled';
}
async function createRoom(){
    try {
        const d=await post('{% url "create_match" %}');
        location.href='/duels/match/'+d.match_id+'/';
    } catch(e){
        notice.textContent=e.message;
    }
}
setInterval(async()=>{
    if(waiting){
        try {
            const r=await fetch('{% url "quick_match_poll" %}');
            const d=await r.json();
            if(d.match_id) location.href='/duels/match/'+d.match_id+'/';
        } catch(e){
            notice.textContent='Retrying connection...';
        }
    }
},2000);
</script>
{% endblock %}
