{% extends 'base.html' %}{% block content %}<h1>Spectator mode</h1><p class="text-muted">Progress refreshes with a short delay. Player code stays private.</p><div id="scores"></div>{% endblock %}{% block extra_js %}<script>async function update(){const d=await (await fetch('{% url "spectator_status" match.id %}')).json();document.getElementById('scores').innerHTML=d.players.map(p=>`<div class="card p-4 mb-2"><h2>${p.name}</h2><p>${p.solved} solved</p></div>`).join('');if(d.status==='active')setTimeout(update,5000)}setTimeout(update,5000);</script>{% endblock %}
