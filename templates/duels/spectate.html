{% extends 'base.html' %}

{% block title %}Spectator Mode - CodeDuels{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-2 fade-in">
    <span class="live-dot"></span>
    <h1 style="margin:0">Spectator Mode</h1>
</div>
<p class="text-muted mb-4">Live duel scores update in real-time. Player source code remains hidden for competition integrity.</p>

<div id="scores" class="fade-in"></div>
{% endblock %}

{% block extra_js %}
<script>
async function update(){
    try {
        const d=await (await fetch('{% url "spectator_status" match.id %}')).json();
        document.getElementById('scores').innerHTML=d.players.map(p=>`
            <div class="card p-4 mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <h2 class="mb-0">${p.name}</h2>
                    <span class="badge badge--yellow" style="font-size:1.1rem;"><span data-icon="star"></span> ${p.solved} solved</span>
                </div>
            </div>
        `).join('');
        if (window.CD && window.CD.hydrateIcons) window.CD.hydrateIcons(document.getElementById('scores'));
        if(d.status==='active') setTimeout(update,5000);
    } catch(e) {}
}
setTimeout(update, 1000);
</script>
{% endblock %}
