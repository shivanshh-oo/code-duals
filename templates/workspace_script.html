<script>
/* =====================================================================
   CodeDuels — Loop Client Runtime
   Provides:
     - SVG icon registry (data-icon)
     - Mobile nav toggle
     - Fetch error interceptor (session/CSRF)
     - Code editor draft backup & tab key
     - Problem tab picker for placement & duel arena
     - IntersectionObserver reveal animations
   ===================================================================== */
(function () {
  'use strict';

  const ICONS = {
    home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
    book: '<path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M19 3v18"/><path d="M8 7h7"/><path d="M8 11h5"/>',
    swords: '<path d="M14 4 9 9"/><path d="M19 9 9 19"/><path d="M5 19l1-4 5-1"/><path d="m21 3-7 7 1 5 4-1z"/>',
    trophy: '<path d="M8 3h8v5a4 4 0 0 1-8 0z"/><path d="M8 5H4v2a4 4 0 0 0 4 4"/><path d="M16 5h4v2a4 4 0 0 1-4 4"/><path d="M10 14h4l1 4H9z"/><path d="M7 21h10"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4"/><path d="M16 3v4"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
    history: '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7v5l3 2"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.6 3-6 7-6s7 2.4 7 6"/><circle cx="17" cy="6" r="3"/><path d="M22 18c0-3-2-5-5-5"/>',
    bell: '<path d="M6 9a6 6 0 0 1 12 0c0 5 2 7 2 7H4s2-2 2-7z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>',
    logout: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 12H3"/><path d="M7 8l-4 4 4 4"/>',
    login: '<path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M14 12h7"/><path d="M18 8l4 4-4 4"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
    zap: '<path d="M13 3 4 14h6l-1 7 9-11h-6z"/>',
    trending: '<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    checkCircle: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
    code: '<path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/><path d="M14 4l-4 16"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>',
    filter: '<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',
    download: '<path d="M12 3v12"/><path d="M7 11l5 4 5-4"/><path d="M5 21h14"/>',
    flame: '<path d="M12 3c2 4-1 5-1 8a4 4 0 0 0 8 0c0-3-3-5-3-8 3 2 5 5 5 9a8 8 0 0 1-16 0c0-4 4-7 7-9z"/>',
    star: '<path d="M12 3l2.5 6 6.5.5-5 4 1.5 6.5L12 17l-5.5 3 1.5-6.5-5-4 6.5-.5z"/>',
    messageAlert: '<path d="M21 12a8 8 0 0 1-11 7l-5 1 1-4a8 8 0 1 1 15-4z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
    award: '<circle cx="12" cy="9" r="6"/><path d="M9 14l-2 7 5-3 5 3-2-7"/>',
    menu: '<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>',
    terminal: '<path d="M4 5h16v14H4z"/><path d="M8 9l3 3-3 3"/><path d="M14 15h3"/>',
    flag: '<path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/>'
  };

  function svgIcon(name, size) {
    size = size || 18;
    const path = ICONS[name] || '';
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size +
           '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle;">' + path + '</svg>';
  }

  function hydrateIcons(root) {
    (root || document).querySelectorAll('[data-icon]').forEach(el => {
      const name = el.getAttribute('data-icon');
      const size = parseInt(el.getAttribute('data-size') || '18', 10);
      el.innerHTML = svgIcon(name, size);
    });
  }

  function setupNav() {
    const btn = document.querySelector('.cd-topbar__toggle');
    const bar = document.querySelector('.cd-topbar');
    if (!btn || !bar) return;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      bar.classList.toggle('is-open');
    });
    document.addEventListener('click', (e) => {
      if (!bar.contains(e.target)) bar.classList.remove('is-open');
    });
  }

  function patchFetch() {
    const originalFetch = window.fetch.bind(window);
    window.fetch = async function (...args) {
      const response = await originalFetch(...args);
      const originalJson = response.json.bind(response);
      response.json = async function () {
        if (response.redirected) {
          throw new Error('Your session changed. Refresh this page and sign in again. Your code is still in the editor.');
        }
        const ct = response.headers.get('content-type') || '';
        if (!ct.includes('application/json')) {
          throw new Error(
            response.status === 403
              ? 'Security token expired. Refresh this page before submitting again.'
              : 'Server error (' + response.status + '). Please retry or check the server log.'
          );
        }
        const data = await originalJson();
        if (!response.ok || data.error) {
          throw new Error(data.error || 'Request failed (' + response.status + ')');
        }
        return data;
      };
      return response;
    };
  }

  function setupEditors() {
    if (document.getElementById('codeEditor') ||
        document.getElementById('placementForm') ||
        document.querySelector('form.solution')) {
      document.body.classList.add('coding-page');
    }

    document.querySelectorAll('textarea[name="code"], textarea[name^="code_"], textarea#codeEditor').forEach(editor => {
      const key = 'codeduels-draft:' + location.pathname + ':' + (editor.name || editor.id);
      if (!editor.value) editor.value = localStorage.getItem(key) || '';
      editor.addEventListener('input', () => localStorage.setItem(key, editor.value));

      editor.addEventListener('keydown', function (e) {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = this.selectionStart;
          const end = this.selectionEnd;
          this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
          this.selectionStart = this.selectionEnd = start + 4;
        }
      });
    });
  }

  function setupPlacementTabs() {
    const placementForm = document.getElementById('placementForm');
    if (placementForm && !placementForm.querySelector('.problem-picker')) {
      const cards = Array.from(placementForm.querySelectorAll('.problem-card'));
      if (cards.length > 1) {
        const picker = document.createElement('nav');
        picker.className = 'problem-picker mb-3';
        picker.setAttribute('aria-label', 'Placement problems');
        placementForm.prepend(picker);

        cards.forEach((card, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = 'Problem ' + (index + 1);
          button.onclick = () => {
            cards.forEach((c, i) => c.style.display = (i === index ? 'block' : 'none'));
            Array.from(picker.children).forEach((b, i) =>
              b.setAttribute('aria-selected', i === index));
          };
          picker.append(button);
          card.style.display = (index === 0 ? 'block' : 'none');
          button.setAttribute('aria-selected', index === 0);
        });
      }
    }
  }

  function setupReveal() {
    const els = document.querySelectorAll('.fade-in, .card, .table, .feature');
    if (!els.length) return;
    if (!('IntersectionObserver' in window)) {
      els.forEach(el => el.classList.add('is-visible'));
      return;
    }
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('is-visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.08 });
    els.forEach(el => obs.observe(el));
  }

  document.addEventListener('DOMContentLoaded', () => {
    hydrateIcons(document);
    setupNav();
    patchFetch();
    setupEditors();
    setupPlacementTabs();
    setupReveal();
  });

  window.CD = window.CD || {};
  window.CD.svgIcon = svgIcon;
  window.CD.hydrateIcons = hydrateIcons;
})();
</script>
