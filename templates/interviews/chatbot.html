{% load static %}
<style>
#ai-chat-toggle { position:fixed; right:16px; bottom:20px; z-index:2100; box-shadow:var(--shadow-md); }
#ai-chat { position:fixed; right:16px; bottom:76px; width:min(400px,calc(100vw - 32px)); max-height:calc(100dvh - 92px); overflow:auto; background:var(--cream); border:1px solid var(--pale-blue-d); border-radius:var(--r-lg); z-index:2100; box-shadow:var(--shadow-lg); }
.ai-chat-header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--navy); color:var(--cream); }
.ai-chat-header h3 { font-size:1rem; color:inherit; margin:0; }
.ai-chat-header img { width:32px; height:32px; border-radius:50%; }
.ai-chat-body { padding:16px; }
#ai-chat-log { display:flex; flex-direction:column; gap:8px; max-height:35dvh; overflow:auto; }
#ai-chat-log:empty,#ai-chat-status:empty { display:none; }
#ai-chat-log p { max-width:92%; padding:9px 12px; margin:0; border-radius:12px; background:var(--pale-blue); white-space:pre-wrap; overflow-wrap:anywhere; }
#ai-chat-log .ai-chat-user { align-self:flex-end; background:var(--yellow); }
#ai-chat-form { display:flex; align-items:flex-end; gap:8px; }
</style>
<button id="ai-chat-toggle" class="btn btn-yellow" aria-expanded="false" aria-controls="ai-chat">Ask AI</button>
<section id="ai-chat" aria-label="AI chatbot" hidden>
  <div class="ai-chat-header"><div class="d-flex align-items-center gap-2"><img src="{% static 'interviews/interviewer.png' %}" alt="" width="32" height="32"><h3>CodeDuels AI</h3></div><button id="ai-chat-close" class="btn btn-sm btn-yellow" aria-label="Close chatbot">✕</button></div>
  <div class="ai-chat-body">
  {% if user.is_authenticated %}
  <p id="ai-chat-welcome" class="small mb-2">Ask a coding question, explore a concept, or get help with an approach.</p>
  <div id="ai-chat-log" role="log" aria-live="polite"></div>
  <form id="ai-chat-form" class="mt-3">{% csrf_token %}<label for="ai-chat-input" class="visually-hidden">Your question</label><textarea id="ai-chat-input" class="form-control" rows="2" maxlength="6000" placeholder="Ask a question…" required></textarea><button class="btn btn-yellow">Send</button></form>
  <p id="ai-chat-status" role="status" class="small mt-2 mb-0"></p>
  {% else %}<p><a href="{% url 'login' %}">Log in</a> to chat with AI.</p>{% endif %}
  </div>
</section>
<script>
window.aiPost = async function(url, data) {
  const response = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('[name=csrfmiddlewaretoken]').value},body:JSON.stringify(data)});
  if(response.redirected) throw new Error('Your session expired. Log in again.');
  let result; try {result=await response.json();} catch(error) {throw new Error(error instanceof SyntaxError ? 'Server unavailable. Please retry.' : error.message);}
  if(!response.ok) throw new Error(result.error || 'Request failed. Please retry.');
  return result;
};
(() => {
  const toggle=document.getElementById('ai-chat-toggle'), panel=document.getElementById('ai-chat');
  function show(open){panel.hidden=!open;toggle.setAttribute('aria-expanded',String(open));(open ? document.getElementById('ai-chat-input') || document.getElementById('ai-chat-close') : toggle).focus();}
  toggle.onclick=()=>show(panel.hidden);
  document.getElementById('ai-chat-close').onclick=()=>show(false);
  panel.addEventListener('keydown',e=>{if(e.key==='Escape')show(false);});
  const form=document.getElementById('ai-chat-form'); if(!form)return;
  const input=document.getElementById('ai-chat-input'), log=document.getElementById('ai-chat-log'), status=document.getElementById('ai-chat-status');
  let history=[];
  form.onsubmit=async e=>{
    e.preventDefault();const question=input.value.trim();if(!question)return;
    const button=form.querySelector('button');button.disabled=true;input.disabled=true;status.textContent='Thinking…';
    try {
      const messages=[...history.slice(-10),{role:'user',content:question}];
      const result=await aiPost('{% url "ai_chat" %}',{messages});
      document.getElementById('ai-chat-welcome').hidden=true;
      for(const [speaker, content] of [['You', question], ['AI', result.reply]]){
        const bubble=document.createElement('p');
        bubble.className=speaker==='You' ? 'ai-chat-user' : 'ai-chat-assistant';
        bubble.textContent=`${speaker}: ${content}`;
        log.append(bubble);
      }
      history=[...messages,{role:'assistant',content:result.reply.slice(0,6000)}];input.value='';status.textContent='';log.scrollTop=log.scrollHeight;
    } catch(error){status.textContent=error.message;}
    finally {button.disabled=false;input.disabled=false;if(!panel.hidden && document.activeElement===document.body)input.focus();}
  };
})();
</script>
