{% extends 'base.html' %}

{% block title %}Question Bank - CodeDuels{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4 fade-in" style="gap:12px;flex-wrap:wrap">
    <h1 style="margin:0">Question Bank</h1>
    <span class="chip chip--info"><span data-icon="book" data-size="14"></span> Practice problems</span>
</div>

<div class="card fade-in mb-4">
    <div class="card-body">
        <div class="row" style="align-items:flex-end;gap:12px">
            <div class="col-md-4">
                <label class="form-label" for="search">Search</label>
                <div style="position:relative">
                    <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--navy-soft)" data-icon="search" data-size="16"></span>
                    <input type="text" id="search" class="form-control" placeholder="Search problems..." style="padding-left:38px">
                </div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="category">Category</label>
                <select id="category" class="form-select">
                    <option value="">All Categories</option>
                    <option value="DSA">DSA</option>
                    <option value="Web Dev">Web Dev</option>
                    <option value="AI-ML">AI-ML</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="difficulty">Difficulty</label>
                <select id="difficulty" class="form-select">
                    <option value="">All Difficulties</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
            <div class="col-md-2">
                <button id="filterBtn" class="btn btn-yellow btn-block w-100"><span data-icon="filter" data-size="16"></span> Filter</button>
            </div>
        </div>
    </div>
</div>

<table class="table fade-in">
    <thead>
        <tr>
            <th>#</th>
            <th>Title</th>
            <th>Category</th>
            <th>Difficulty</th>
            <th>Rating</th>
        </tr>
    </thead>
    <tbody id="problemList">
        <tr><td colspan="5" class="text-center text-muted py-4">Loading problems...</td></tr>
    </tbody>
</table>
{% endblock %}

{% block extra_js %}
<script>
function loadProblems() {
    const escapeHtml = value => { const node = document.createElement('span'); node.textContent = value; return node.innerHTML.replaceAll('"', '&quot;'); };
    const search = document.getElementById('search').value;
    const category = document.getElementById('category').value;
    const difficulty = document.getElementById('difficulty').value;
    const params = new URLSearchParams();
    if (search) params.append('search', search);
    if (category) params.append('category', category);
    if (difficulty) params.append('difficulty', difficulty);

    fetch('{% url "problem_list_api" %}?' + params.toString())
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('problemList');
            if (!data.problems || data.problems.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No problems found.</td></tr>';
                return;
            }
            tbody.innerHTML = data.problems.map((p, i) => {
                const diffClass = p.difficulty === 'Easy' ? 'chip--diff-easy' : p.difficulty === 'Medium' ? 'chip--diff-medium' : 'chip--diff-hard';
                return `
                    <tr>
                        <td><strong>${i + 1}</strong></td>
                        <td><a href="${escapeHtml(p.url)}"><strong>${escapeHtml(p.title)}</strong></a> <small>${escapeHtml(p.source)}</small></td>
                        <td><span class="chip">${p.category}</span></td>
                        <td><span class="chip ${diffClass}">${p.difficulty}</span></td>
                        <td><span class="badge badge--yellow">${p.difficulty_rating}</span></td>
                    </tr>
                `;
            }).join('');
        });
}

document.getElementById('filterBtn').addEventListener('click', loadProblems);
document.getElementById('search').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') loadProblems();
});

loadProblems();
setInterval(loadProblems, 60000);
</script>
{% endblock %}
